version: '3.8'

services:
  # LiveKit WebRTC Server
  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit-server
    ports:
      - "7880:7880"     # WebRTC signaling (TCP)
      - "7881:7881"     # TURN server (TCP/UDP)  
      - "7882:7882/udp" # ICE candidate range start
      - "7883:7883/udp"
      - "7884:7884/udp"
      - "7885:7885/udp"
      - "7886:7886/udp"
      - "7887:7887/udp"
      - "7888:7888/udp"
      - "7889:7889/udp"
      - "7890:7890/udp" # ICE candidate range end
    environment:
      - LIVEKIT_KEYS=devkey:secret
      - LIVEKIT_CONFIG=/etc/livekit.yaml
    volumes:
      - ./livekit-config.yaml:/etc/livekit.yaml:ro
    networks:
      - ai-voice-network
    restart: unless-stopped
    command: 
      - --config
      - /etc/livekit.yaml
      - --dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7880/", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Vosk STT Service
  vosk-server:
    build: 
      context: ./vosk-server/docker
      dockerfile: Dockerfile.kaldi-tr
    container_name: vosk-server
    ports:
      - "2700:2700"
    environment:
      - VOSK_SERVER_PORT=2700
    networks:
      - ai-voice-network
    restart: unless-stopped

  # Piper TTS Service
  piper-tts-server:
    image: dehalokmansahin/piper-tts-server:latest
    container_name: piper-tts-server
    ports:
      - "8000:8000"
    networks:
      - ai-voice-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # (removed: llm-turkish-server)
  # OpenSIPS AI Voice Connector (using voice-ai-core framework)
  opensips-ai-voice-connector:
    build:
      context: .
      dockerfile: opensips-ai-voice-connector/Dockerfile
    container_name: opensips-ai-voice-connector
    ports:
      - "8089:8089/tcp"
      - "8089:8089/udp"
      - "8090:8090/udp"
      - "35000-35100:35000-35100/udp"
    environment:
      - CONFIG_FILE=/app/cfg/opensips-ai-voice-connector.ini
      - VOSK_SERVER_URL=ws://vosk-server:2700
      - PIPER_TTS_URL=ws://piper-tts-server:8000
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_SECRET_KEY=secret
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./opensips-ai-voice-connector/cfg:/app/cfg:ro
    depends_on:
      - livekit
      - vosk-server
      - piper-tts-server
    networks:
      - ai-voice-network
    restart: unless-stopped

  # OpenSIPS SIP Proxy
  opensips:
    image: opensips/opensips:3.6
    container_name: opensips
    ports:
      - "5060:5060/tcp"
      - "5060:5060/udp"
      - "8080:8080"
    volumes:
      - ./opensips-ai-voice-connector/cfg/opensips.cfg:/etc/opensips/opensips.cfg:ro
    networks:
      - ai-voice-network
    restart: unless-stopped

networks:
  ai-voice-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  piper_models:
    driver: local
  piper_cache:
    driver: local